model_name: bert-base-uncased
max_length: 256
batch_size: 8
learning_rate: 0.00002
weight_decay: 0.01
warmup_fraction: 0.10
gradient_clip: 1.0
dropout: 0.10
max_epochs: 5
early_stopping_patience: 2
early_stopping_fraction: 0.10
seed: 42
num_labels: 4

# These are descriptions, not CSV column names. The two lexical rates are
# derived from title + transcript inside each fitted pipeline.
derived_auxiliary_features:
  - certainty_score
  - hedge_score
raw_auxiliary_columns:
  - likes
  - comments
  - views
  - duration_sec
