seed: 42

data:
  dataset_path: data/dataset.csv
  source_links_path: YT_Shorts_wm222dk_transcription/collection_of_all_links.txt
  train_indices_path: data/train_indices.csv
  test_indices_path: data/test_indices.csv
  excluded_indices_path: data/excluded_indices.csv
  split_manifest_path: data/split_manifest.json
  validation_report_path: data/validation_report.json
  target_column: label
  expected_rows: 250
  # The thesis inclusion/label rule requires at least two eligible claims.
  # A blank label is accepted only below that same threshold.
  minimum_claims_for_assigned_label: 2
  unassigned_allowed_below_claims: 2
  maximum_duration_seconds: 180
  # Audit flag only: rows below this Latin-letter fraction require manual
  # review against the stated English-language inclusion criterion.
  minimum_latin_letter_fraction_for_review: 0.80

split:
  # One grouped fold is frozen as the 20% final held-out set. The same thesis
  # seed is reused by every condition; changing the dataset requires a newly
  # frozen split and a complete rerun of all fourteen conditions.
  seed: 42
  heldout_folds: 5
  # Select the group-safe fold closest to ceil(20% of labelled rows), breaking
  # ties by class-distribution error and then fold number.
  heldout_fold: auto
  # The published frozen row split was originally generated from exact
  # normalized-transcript groups. Near-duplicate groups are a stricter,
  # independent safety audit and must also remain within one partition.
  generation_grouping: exact_normalized_transcript_sha256

features:
  linguistic_lexicon_path: configs/linguistic_lexicons.yaml
  tfidf:
    max_features: 300
    ngram_range: [1, 2]
    stop_words: english
  raw_engagement_columns:
    - likes
    - comments
    - views
    - duration_sec

ridge:
  alphas: [0.1, 1.0, 10.0]

logistic_regression:
  c_values: [0.1, 1.0, 10.0]
  max_iter: 2000

complement_naive_bayes:
  alphas: [0.1, 1.0, 10.0]

decision_tree:
  max_depths: [3, 5, 7]
  min_samples_leaf: [2, 5, 10]

minilm:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  # Set to an immutable Hub commit for a definitive rerun. The resolved commit
  # is also written to the model artifacts.
  revision: null
  batch_size: 32
  expected_embedding_dimension: 384
  expected_max_sequence_length: 256
  c_values: [0.1, 1.0, 10.0]

evaluation:
  outer_folds: 5
  inner_folds: 3
  bootstrap_resamples: 10000
  primary_metric: quadratic_weighted_kappa
  n_jobs: 1

interpretability:
  top_features_per_class: 20
  top_features_per_tree: 30
  local_features_per_prediction: 10

sensitivity:
  run_name: sensitivity_no_two_claims
  exclude_total_claims: [2]

reporting:
  confidence_level: 0.95
  association_bootstrap_resamples: 5000
  include_baselines: true
