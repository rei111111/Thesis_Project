seed: 42

data:
  dataset_path: data/dataset.csv
  train_indices_path: data/train_indices.csv
  test_indices_path: data/test_indices.csv
  excluded_indices_path: data/excluded_indices.csv
  split_manifest_path: data/split_manifest.json
  validation_report_path: data/validation_report.json
  target_column: label
  expected_rows: 250
  # A label can be assigned from one or more claims. A blank label is accepted
  # only when the annotation contains fewer than two eligible claims.
  minimum_claims_for_assigned_label: 1
  unassigned_allowed_below_claims: 2

split:
  # One grouped fold is frozen as the 20% final held-out set. The same thesis
  # seed is reused by every condition; changing the dataset requires a newly
  # frozen split and a complete rerun of all fourteen conditions.
  seed: 42
  heldout_folds: 5
  # Select the group-safe fold closest to ceil(20% of labelled rows), breaking
  # ties by class-distribution error and then fold number.
  heldout_fold: auto

features:
  linguistic_lexicon_path: configs/linguistic_lexicons.yaml
  tfidf:
    max_features: 300
    ngram_range: [1, 2]
    stop_words: english
  raw_engagement_columns:
    - likes
    - comments
    - views
    - duration_sec

ridge:
  alphas: [0.1, 1.0, 10.0]

logistic_regression:
  c_values: [0.1, 1.0, 10.0]
  max_iter: 2000

complement_naive_bayes:
  alphas: [0.1, 1.0, 10.0]

decision_tree:
  max_depths: [3, 5, 7]
  min_samples_leaf: [2, 5, 10]

minilm:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32
  c_values: [0.1, 1.0, 10.0]

evaluation:
  outer_folds: 5
  inner_folds: 3
  bootstrap_resamples: 10000
  primary_metric: quadratic_weighted_kappa
  n_jobs: 1

interpretability:
  top_features_per_class: 20
  top_features_per_tree: 30
  local_features_per_prediction: 10

sensitivity:
  run_name: sensitivity_no_two_claims
  exclude_total_claims: [2]

reporting:
  confidence_level: 0.95
  association_bootstrap_resamples: 5000
  include_baselines: true
