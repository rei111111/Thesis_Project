seed: 42

data:
  mode: pooled_multiplatform
  sources:
    - name: youtube
      path: data/dataset.csv
      expected_rows: 250
      title_placeholders: []
      require_all_titles_placeholder: false
    - name: tiktok
      path: data/adhd_misinformation_tiktok.csv
      expected_rows: 248
      # The raw CSV remains unchanged. This declaration is audited, while the
      # pooled model uses transcript only for every platform.
      title_placeholders: [video]
      # Title contents are author-controlled and advisory. Even if they change,
      # this column remains excluded from every pooled model.
      require_all_titles_placeholder: false
  train_indices_path: data/multiplatform/train_indices.csv
  test_indices_path: data/multiplatform/test_indices.csv
  excluded_indices_path: data/multiplatform/excluded_indices.csv
  split_manifest_path: data/multiplatform/split_manifest.json
  validation_report_path: data/multiplatform/validation_report.json
  target_column: label
  expected_rows: 498
  minimum_claims_for_assigned_label: 2
  unassigned_allowed_below_claims: 2
  maximum_duration_seconds: 180
  minimum_latin_letter_fraction_for_review: 0.80

split:
  seed: 42
  heldout_folds: 5
  heldout_fold: auto
  # Label is always appended by the splitter, producing platform x label
  # strata. Near-duplicate groups are used to create—not merely audit—the new
  # pooled split.
  stratification_columns: [platform]
  generation_grouping: near_duplicate_transcript_connected_components

features:
  linguistic_lexicon_path: configs/linguistic_lexicons.yaml
  # Titles are preserved in both immutable source CSVs but deliberately absent
  # from every pooled text and linguistic feature.
  text_columns: [transcript]
  engagement_transform: within_platform_percentile
  platform_column: platform
  tfidf:
    max_features: 300
    ngram_range: [1, 2]
    stop_words: english
  raw_engagement_columns:
    - likes
    - comments
    - views
    - duration_sec

ridge:
  alphas: [0.1, 1.0, 10.0]

logistic_regression:
  c_values: [0.1, 1.0, 10.0]
  max_iter: 2000

complement_naive_bayes:
  alphas: [0.1, 1.0, 10.0]

decision_tree:
  max_depths: [3, 5, 7]
  min_samples_leaf: [2, 5, 10]

minilm:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  revision: null
  batch_size: 32
  expected_embedding_dimension: 384
  expected_max_sequence_length: 256
  c_values: [0.1, 1.0, 10.0]

evaluation:
  outer_folds: 5
  inner_folds: 3
  bootstrap_resamples: 10000
  primary_metric: quadratic_weighted_kappa
  n_jobs: 1

interpretability:
  top_features_per_class: 20
  top_features_per_tree: 30
  local_features_per_prediction: 10

sensitivity:
  run_name: pooled_multiplatform_reannotated_no_two_claims
  exclude_total_claims: [2]

reporting:
  default_run_name: pooled_multiplatform_reannotated
  confidence_level: 0.95
  association_bootstrap_resamples: 5000
  include_baselines: true
  report_by_platform: true
